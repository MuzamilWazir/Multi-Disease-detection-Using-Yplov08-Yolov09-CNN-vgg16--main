{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 80px;">

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; flex-wrap: wrap; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M3 12h4M17 12h4M12 3v4M12 17v4"></path>
        </svg>
      </div>
      <h1 style="font-size: 20px; font-weight: 600;">Disease Detection</h1>
    </div>
    <div class="mono" style="display: flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent); padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 500;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block;"></span>
      YOLOv8 MODEL READY
    </div>
  </div>

  <!-- Main grid -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;" class="dd-grid">

    <!-- Upload card -->
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: 0 1px 2px rgba(20,24,26,0.04);">
      <div class="mono" style="font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 6px;">STEP 01</div>
      <h2 style="font-size: 18px; margin-bottom: 20px;">Upload image or video</h2>

      <form method="post" enctype="multipart/form-data" name="form1" id="detect-form">

        <label for="inputfile" id="dropzone" style="display: block; position: relative; border: 2px dashed var(--border); border-radius: 10px; padding: 44px 20px; text-align: center; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;">

          <span style="position: absolute; top: 10px; left: 10px; width: 14px; height: 14px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); opacity: 0.5;"></span>
          <span style="position: absolute; top: 10px; right: 10px; width: 14px; height: 14px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); opacity: 0.5;"></span>
          <span style="position: absolute; bottom: 10px; left: 10px; width: 14px; height: 14px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); opacity: 0.5;"></span>
          <span style="position: absolute; bottom: 10px; right: 10px; width: 14px; height: 14px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); opacity: 0.5;"></span>

          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6B7178" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>

          <div style="font-size: 14px; font-weight: 500; margin-bottom: 4px;">Click to browse, or drag a file here</div>
          <div class="mono" style="font-size: 12px; color: var(--muted);">Supports .jpg and .mp4</div>

          <input type="file" name="file" id="inputfile" accept=".jpg,.jpeg,.mp4" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden;" required>
        </label>

        <div id="file-name-display" class="mono" style="font-size: 13px; color: var(--muted); margin-top: 12px; min-height: 18px;"></div>

        <button type="submit" id="submit-btn" style="width: 100%; margin-top: 20px; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s ease;">
          Run detection
        </button>

      </form>
    </div>

    <!-- Results card -->
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: 0 1px 2px rgba(20,24,26,0.04);">
      <div class="mono" style="font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 6px;">STEP 02</div>
      <h2 style="font-size: 18px; margin-bottom: 20px;">Results</h2>

      <div style="position: relative; min-height: 260px; border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg);">

        <span style="position: absolute; top: 10px; left: 10px; width: 14px; height: 14px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); opacity: 0.5;"></span>
        <span style="position: absolute; top: 10px; right: 10px; width: 14px; height: 14px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); opacity: 0.5;"></span>
        <span style="position: absolute; bottom: 10px; left: 10px; width: 14px; height: 14px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); opacity: 0.5;"></span>
        <span style="position: absolute; bottom: 10px; right: 10px; width: 14px; height: 14px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); opacity: 0.5;"></span>

        <div id="empty-state" style="text-align: center; color: var(--muted); padding: 20px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7178" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="9" cy="9" r="2"></circle>
            <path d="M21 15l-5-5L5 21"></path>
          </svg>
          <div style="font-size: 13px;">Detected output will appear here</div>
        </div>

        <img id="my-image" src="{{ url_for('predict_img', filename=image_path) }}" style="max-width: 100%; max-height: 500px; display: none;"/>
        <img id="my-video-image" src="{{ url_for('video_feed') }}" style="max-width: 100%; max-height: 500px; display: none;"/>

      </div>
    </div>

  </div>
</div>

<style>
  @media (max-width: 860px) {
    .dd-grid { grid-template-columns: 1fr !important; }
  }
  #dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }
  #submit-btn:hover { background: #0c4a3d; }
  #submit-btn:disabled { background: #A9B0AC; cursor: not-allowed; }
</style>

{% endblock content %}

{% block javascripts %}
<script>
  var input = document.getElementById('inputfile');
  var nameDisplay = document.getElementById('file-name-display');
  var form = document.getElementById('detect-form');
  var submitBtn = document.getElementById('submit-btn');

  input.addEventListener('change', function () {
    if (input.files && input.files.length > 0) {
      nameDisplay.textContent = 'Selected: ' + input.files[0].name;
    } else {
      nameDisplay.textContent = '';
    }
  });

  form.addEventListener('submit', function () {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Processing…';
  });

  document.getElementById('my-image').onload = function () {
    this.style.display = 'block';
    document.getElementById('empty-state').style.display = 'none';
  };

  document.getElementById('my-video-image').onload = function () {
    this.style.display = 'block';
    document.getElementById('empty-state').style.display = 'none';
  };
</script>
{% endblock javascripts %}
